spring.application.name=specialservice
server.port=${PORT:8080}

# Database Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SpecialService}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Logging Configuration
logging.file.name=${LOG_FILE:logs/app-service.log}
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# JWT Configuration
jwt.token.validity=18000
jwt.signing.key=${JWT_SECRET:4352345324532453245324532453245342532453453425345324}
jwt.authorities.key=roles
jwt.token.prefix=Bearer
jwt.header.string=Authorization

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# File Storage Configuration
app.upload.dir=${UPLOAD_DIR:uploads}
